<title>數感快手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2140; --ink-soft:#5b527a; --bg:#fbf6e9; --bg2:#eef5e6;
    --card:#ffffff; --card-border:#e7ded0; --accent:#ff6b4a; --accent-ink:#ffffff;
    --accent2:#2f9e8f; --gold:#ffb43c; --wrong:#e5484d; --right:#2f9e5a;
    --shadow: 0 6px 0 rgba(43,33,64,0.08), 0 10px 24px rgba(43,33,64,0.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f1ece0; --ink-soft:#c9c2df; --bg:#1b2420; --bg2:#212c26;
      --card:#26332c; --card-border:#3a4a40; --accent:#ff8a68; --accent-ink:#26170f;
      --accent2:#4bc2b0; --gold:#ffc45e; --wrong:#ff6b6f; --right:#57d17f;
      --shadow: 0 6px 0 rgba(0,0,0,0.25), 0 10px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --ink:#f1ece0; --ink-soft:#c9c2df; --bg:#1b2420; --bg2:#212c26;
    --card:#26332c; --card-border:#3a4a40; --accent:#ff8a68; --accent-ink:#26170f;
    --accent2:#4bc2b0; --gold:#ffc45e; --wrong:#ff6b6f; --right:#57d17f;
    --shadow: 0 6px 0 rgba(0,0,0,0.25), 0 10px 24px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Baloo 2","PingFang TC","Microsoft JhengHei","Heiti TC",-apple-system,sans-serif;
    padding-inline:16px; padding-block:18px 40px; line-height:1.8;
  }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  p{margin:0;}
  button{ font-family:inherit; }
  ruby{ ruby-position:inter-character; }
  rt{ font-size:0.62em; color:var(--ink-soft); font-weight:700; user-select:none; margin-inline-start:1px; }
  body.zy-off rt{ display:none; }
  .btn{
    font-family:inherit; font-weight:700; font-size:16px; border-radius:14px; border:none;
    padding:12px 18px; cursor:pointer; background:var(--card); color:var(--ink);
    border:2px solid var(--card-border); box-shadow:var(--shadow);
    transition:transform .08s ease;
  }
  .btn:active{ transform:translateY(3px); box-shadow:none; }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  .btn.gold{ background:var(--gold); color:#4a2e00; border-color:transparent; }
  .btn.ghost{ background:transparent; box-shadow:none; }
  .btn:focus-visible{ outline:3px solid var(--accent2); outline-offset:2px; }
  .btn:disabled{ opacity:.5; cursor:default; }

  #app{ max-width:920px; margin:0 auto; position:relative; }
  .hub-hero{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    background:linear-gradient(135deg,var(--bg2),var(--bg));
    border:2px solid var(--card-border); border-radius:22px; padding:22px;
    margin-bottom:20px; overflow:hidden; position:relative; flex-wrap:wrap;
  }
  .hub-hero .txt{ max-width:520px; }
  .hub-hero .eyebrow{ font-size:14px; letter-spacing:.06em; color:var(--accent2); font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .hub-hero .eyebrow a{ color:var(--accent2); text-decoration:underline; font-weight:700; }
  .hub-hero h1{ font-size:clamp(26px,5vw,36px); font-weight:800; margin-top:6px; }
  .hub-hero .sub{ color:var(--ink-soft); font-size:16px; margin-top:10px; line-height:2.1; }
  .hub-hero .mascot{ font-size:74px; filter:drop-shadow(0 8px 10px rgba(0,0,0,.15)); }
  .hub-controls{ display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
  #zy-toggle{ font-size:14px; padding:8px 14px; }
  #who-badge{ font-size:13px; padding:8px 14px; }

  .level-card{
    background:var(--card); border:2px solid var(--card-border); border-radius:18px;
    padding:16px 18px; margin-bottom:18px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .level-card .badge{ font-size:38px; flex:0 0 auto; }
  .level-card .info{ flex:1; min-width:180px; }
  .level-card .lv-title{ font-weight:800; font-size:17px; }
  .level-card .xp-row{ display:flex; align-items:center; gap:10px; margin-top:8px; }
  .level-card .xp-bar{ flex:1; height:10px; border-radius:99px; background:var(--bg2); border:1px solid var(--card-border); overflow:hidden; }
  .level-card .xp-bar .fill{ height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width .5s ease; }
  .level-card .xp-txt{ font-size:12px; color:var(--ink-soft); font-weight:700; white-space:nowrap; }
  .level-card .lb-btn{ flex:0 0 auto; }

  .mode-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; margin-bottom:20px; }
  .mode-card{
    text-align:left; background:var(--card); border:2px solid var(--card-border); border-radius:20px;
    padding:20px; cursor:pointer; position:relative; box-shadow:var(--shadow); color:var(--ink);
    display:flex; flex-direction:column; gap:10px;
  }
  .mode-card:active{ transform:translateY(3px); box-shadow:none; }
  .mode-card .icon{ font-size:38px; }
  .mode-card .title{ font-size:20px; font-weight:800; line-height:1.9; }
  .mode-card .desc{ font-size:14px; color:var(--ink-soft); line-height:2; }
  .mode-card .rec{
    position:absolute; top:14px; right:14px; background:var(--accent); color:var(--accent-ink);
    font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px;
  }
  .mode-card.mixed{ border-color:var(--accent); background:linear-gradient(160deg,var(--card),var(--bg2)); }

  .login-card{
    background:var(--card); border:2px solid var(--card-border); border-radius:18px;
    padding:18px; margin-bottom:20px; box-shadow:var(--shadow);
  }
  .login-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .login-row select, .login-row input{
    flex:1; min-width:140px; padding:11px 12px; border-radius:12px; border:2px solid var(--card-border);
    font-size:15px; font-family:inherit; background:var(--card); color:var(--ink);
  }
  .login-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }

  #game-overlay{ position:fixed; inset:0; background:var(--bg); z-index:50; overflow-y:auto; height:100%; }
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
    display:flex; align-items:center; gap:12px; padding:14px 16px;
    background:var(--bg); border-bottom:2px solid var(--card-border);
  }
  .topbar .back{ background:var(--card); border:2px solid var(--card-border); border-radius:12px; padding:8px 12px; font-weight:700; cursor:pointer; color:var(--ink); }
  .topbar .ttl{ font-weight:800; font-size:17px; flex:1; line-height:1.9; }
  .topbar .prog{ font-size:13px; color:var(--ink-soft); font-weight:700; white-space:nowrap; }
  .game-body{ max-width:560px; margin:0 auto; padding:18px 16px 40px; }

  .progressbar{ height:8px; border-radius:99px; background:var(--bg2); border:1px solid var(--card-border); overflow:hidden; margin-bottom:16px; }
  .progressbar .fill{ height:100%; background:var(--accent2); transition:width .3s ease; }

  .combo-badge{
    text-align:center; font-weight:800; font-size:14px; color:var(--gold);
    min-height:22px; margin-bottom:4px;
  }

  .flash-stage{
    background:var(--card); border:2px solid var(--card-border); border-radius:22px;
    padding:26px 16px; box-shadow:var(--shadow); display:flex; flex-direction:column;
    align-items:center; gap:14px; min-height:190px; justify-content:center;
  }
  .flash-ready{ font-size:22px; font-weight:800; color:var(--ink-soft); }
  .flash-hidden{ font-size:60px; }

  .tf-wrap{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .tenframe{
    display:grid; grid-template-columns:repeat(5,1fr); grid-auto-rows:1fr; gap:6px;
    background:var(--bg2); border:2px solid var(--card-border); border-radius:14px; padding:8px;
  }
  .tf-cell{ width:28px; height:28px; border-radius:50%; background:var(--card); border:2px solid var(--card-border); }
  .tf-cell.filled{ background:var(--accent); border-color:transparent; }
  .scatter-box{
    position:relative; width:220px; height:150px; background:var(--bg2);
    border:2px solid var(--card-border); border-radius:16px;
  }
  .scatter-dot{ position:absolute; width:22px; height:22px; border-radius:50%; background:var(--accent); }

  .q-text{ font-size:18px; font-weight:700; text-align:center; margin:14px 0 4px; line-height:2.1; }
  .qtimer{ height:8px; border-radius:99px; background:var(--bg2); border:1px solid var(--card-border); overflow:hidden; max-width:280px; margin:10px auto 4px; }
  .qtimer .fill{ height:100%; background:var(--accent2); width:100%; }
  .qtimer.low .fill{ background:var(--wrong); }

  .quiz-choices{ display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:12px; margin-top:18px; }
  .choice-btn{
    background:var(--card); border:2px solid var(--card-border); border-radius:16px; padding:16px 10px;
    font-size:22px; font-weight:800; cursor:pointer; box-shadow:var(--shadow); color:var(--ink);
    display:flex; align-items:center; justify-content:center; min-height:64px; text-align:center;
  }
  .choice-btn:active{ transform:translateY(3px); box-shadow:none; }
  .choice-btn.correct{ background:var(--right); color:#fff; border-color:transparent; }
  .choice-btn.wrong{ background:var(--wrong); color:#fff; border-color:transparent; animation:shake .3s; }
  .choice-btn[disabled]{ cursor:default; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  .feedback{ text-align:center; margin-top:16px; font-weight:700; font-size:16px; min-height:44px; line-height:1.7; }
  .feedback.ok{ color:var(--right); }
  .feedback.no{ color:var(--wrong); }
  .feedback .react{ display:block; font-size:13px; color:var(--ink-soft); font-weight:700; }
  .feedback .xp-pop{ display:inline-block; margin-left:6px; color:var(--gold); }
  .nextbar{ display:flex; justify-content:center; margin-top:14px; min-height:48px; }

  .results{ text-align:center; padding-top:16px; }
  .results .emoji-lg{ font-size:48px; }
  .results .xp-gain{ font-size:34px; font-weight:800; color:var(--gold); margin:10px 0; opacity:0; transform:scale(.5); animation:pop .4s .1s forwards; }
  @keyframes pop{ to{opacity:1; transform:scale(1);} }
  .results .stat-row{ display:flex; justify-content:center; gap:18px; flex-wrap:wrap; margin:14px 0; }
  .results .stat{ background:var(--bg2); border-radius:14px; padding:10px 16px; min-width:96px; }
  .results .stat .v{ font-size:20px; font-weight:800; }
  .results .stat .l{ font-size:12px; color:var(--ink-soft); font-weight:700; }
  .results .levelup{
    background:linear-gradient(135deg,var(--gold),var(--accent)); color:#3a2200; font-weight:800;
    border-radius:16px; padding:12px 16px; margin:14px auto; max-width:340px;
  }
  .results .levelbar-wrap{ max-width:320px; margin:14px auto 4px; }
  .results .btnrow{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:16px; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:60;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .modal-card{
    background:var(--card); border-radius:18px; padding:22px; max-width:440px; width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,0.3); color:var(--ink); max-height:85vh; overflow-y:auto;
  }
  .lb-scope{ display:flex; gap:8px; margin:12px 0; }
  .lb-scope button{ font-size:13px; padding:7px 12px; }
  .lb-scope button.active{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  .lb-row{ display:flex; align-items:center; gap:10px; padding:9px 6px; border-bottom:1px solid var(--card-border); }
  .lb-row.me{ background:var(--bg2); border-radius:10px; }
  .lb-row .rank{ width:30px; text-align:center; font-weight:800; flex:0 0 auto; }
  .lb-row .nm{ flex:1; font-weight:700; font-size:14px; }
  .lb-row .cls{ font-size:11px; color:var(--ink-soft); }
  .lb-row .xp{ font-weight:800; color:var(--accent2); font-size:14px; white-space:nowrap; }
  .lb-empty{ text-align:center; color:var(--ink-soft); padding:20px 0; font-size:14px; }

  [hidden]{ display:none !important; }
</style>

<div id="app">
  <div class="hub-hero">
    <div class="txt">
      <div class="eyebrow"><span id="hero-eyebrow"></span> · <a href="number-forest.html" id="forest-link"></a></div>
      <h1>⚡ 數感快手</h1>
      <p class="sub" id="hero-sub"></p>
      <div class="hub-controls">
        <button class="btn ghost" id="zy-toggle"></button>
        <button class="btn ghost" id="who-badge" hidden></button>
        <button class="btn ghost" id="gear-btn" title="teacher settings" style="padding:8px 12px;">⚙️</button>
      </div>
    </div>
    <div class="mascot">🐇</div>
  </div>
  <div class="login-card" id="login-card" hidden></div>
  <div class="level-card" id="level-card"></div>
  <div class="mode-grid" id="mode-grid"></div>
</div>

<div id="settings-modal" class="modal-overlay" hidden>
  <div class="modal-card">
    <h3 style="margin:0 0 4px;">⚙️ 老師專用設定</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 12px;line-height:1.9;">
      這裡跟「數字森林闖關」共用同一個 Google Apps Script 網址，只要設定過一次，兩個遊戲都能記錄成績。
    </p>
    <input id="api-input" placeholder="https://script.google.com/macros/s/.../exec" style="width:100%;padding:10px;border-radius:10px;border:2px solid var(--card-border);font-size:13px;margin-bottom:10px;box-sizing:border-box;">
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn primary" id="api-save">儲存</button>
      <button class="btn" id="settings-close">關閉</button>
    </div>
    <p id="api-status" style="margin-top:12px;font-size:13px;color:var(--ink-soft);line-height:1.8;"></p>
  </div>
</div>

<div id="lb-modal" class="modal-overlay" hidden>
  <div class="modal-card">
    <h3 style="margin:0 0 4px;">🏆 <span id="lb-title"></span></h3>
    <div class="lb-scope" id="lb-scope"></div>
    <div id="lb-body"></div>
    <div style="margin-top:14px;text-align:right;">
      <button class="btn" id="lb-close"></button>
    </div>
  </div>
</div>

<div id="game-overlay" hidden>
  <div class="topbar">
    <button class="back" id="btn-back"></button>
    <div class="ttl" id="game-ttl"></div>
    <div class="prog" id="game-prog"></div>
  </div>
  <div class="game-body" id="game-body"></div>
</div>

  function az(text){
    var out='', chars=Array.from(String(text)), i=0;
    while(i<chars.length){
      if(i+1<chars.length){
        var two = chars[i]+chars[i+1];
        if(PHRASE_ZY[two]){
          out += '<ruby>'+chars[i]+'<rt>'+PHRASE_ZY[two][0]+'</rt></ruby>';
          out += '<ruby>'+chars[i+1]+'<rt>'+PHRASE_ZY[two][1]+'</rt></ruby>';
          i+=2; continue;
        }
      }
      var ch = chars[i];
      if(CHAR_ZY[ch]) out += '<ruby>'+ch+'<rt>'+CHAR_ZY[ch]+'</rt></ruby>';
      else out += ch;
      i++;
    }
    return out;
  }

  var LEVELS = [
    {need:0,    title:'新手數星星'},

  function levelInfo(xp){
    var lvl=1, title=LEVELS[0].title, next=LEVELS[1]||null;
    for(var i=0;i<LEVELS.length;i++){
      if(xp>=LEVELS[i].need){ lvl=i+1; title=LEVELS[i].title; next=LEVELS[i+1]||null; }
    }
    var curNeed = LEVELS[lvl-1].need;
    var nextNeed = next? next.need : null;
    var pct = next? clamp(Math.round((xp-curNeed)/(nextNeed-curNeed)*100),0,100) : 100;
    return {level:lvl, title:title, next:next, pct:pct, curNeed:curNeed, nextNeed:nextNeed, xp:xp};
  }

      maxN: lvl>=6 ? 20 : 10,
      scatter: lvl>=6
    };
  }

  function makeChoices(correct,min,max){
    var set={}; set[correct]=true; var opts=[correct];
    var deltas = shuffle([1,-1,2,-2,3,-3,4,-4]);
    deltas.forEach(function(d){
      if(opts.length>=4) return;
      var v=correct+d;
      if(v>=min && v<=max && !set[v]){ set[v]=true; opts.push(v); }
    });
    var guard=0;
    while(opts.length<4 && guard<40){
      var v=rand(min,max);
      if(!set[v]){ set[v]=true; opts.push(v); }
      guard++;
    }
    return shuffle(opts);
  }

  /* ================= dot pattern rendering ================= */
  function renderTenFrame(n){
    var frames = [];
    var rest = n;
    if(n<=10){ frames.push(clamp(rest,0,10)); }
    else { frames.push(10); frames.push(clamp(n-10,0,10)); }
    return '<div class="tf-wrap">' + frames.map(function(count){
      var cells='';
      for(var i=0;i<10;i++){ cells += '<div class="tf-cell'+(i<count?' filled':'')+'"></div>'; }
      return '<div class="tenframe">'+cells+'</div>';
    }).join('') + '</div>';
  }
  function renderScatter(n){
    var pts=[], guard=0;
    while(pts.length<n && guard<300){
      guard++;
      var x = rand(6,182), y = rand(6,112);
      var ok = pts.every(function(p){ return Math.abs(p.x-x)>24 || Math.abs(p.y-y)>24; });
      if(ok) pts.push({x:x,y:y});
    }
    return '<div class="scatter-box">' + pts.map(function(p){
      return '<div class="scatter-dot" style="left:'+p.x+'px;top:'+p.y+'px;"></div>';
    }).join('') + '</div>';
  }

  /* ================= question builders ================= */
  function buildFlashQuestion(diff){
    var n = rand(1, diff.maxN);
    var useScatter = diff.scatter && n<=10 && Math.random()<0.4;
    return { n:n, correct:n, useScatter:useScatter, choices: makeChoices(n,1,diff.maxN) };
  }
  function buildMake10Question(){
    var n = rand(0,10);
    var correct = 10-n;
    return { n:n, correct:correct, choices: makeChoices(correct,0,10) };
  }

          + '<span class="xp">'+r.totalXp+' XP<br><span class="cls">Lv.'+li.level+' '+az(li.title)+'</span></span>'
          + '</div>';
      }).join('');
    });
  }
  document.getElementById('lb-close').addEventListener('click', function(){ lbModal.hidden = true; });

  /* ================= game engine ================= */
  var overlay = document.getElementById('game-overlay');
  var gameBody = document.getElementById('game-body');
  var gameTtl = document.getElementById('game-ttl');
  var gameProg = document.getElementById('game-prog');
  document.getElementById('btn-back').innerHTML = az('返回');
  document.getElementById('btn-back').addEventListener('click', closeGame);

  var state = null;
  var advanceTimer = null;

  function closeGame(){
    if(advanceTimer){ clearTimeout(advanceTimer); advanceTimer=null; }
    overlay.hidden = true;
    document.body.style.overflow = '';
    gameBody.innerHTML = '';
    state = null;
    renderHub();
  }

  function startRound(modeId){
    state = { mode:modeId, idx:0, total:10, correct:0, streak:0, bestStreak:0, xp:0, reactions:[] };
    var mode = MODES.filter(function(m){ return m.id===modeId; })[0];
    gameTtl.innerHTML = mode.icon+' '+az(mode.title);
    overlay.hidden = false;
    document.body.style.overflow = 'hidden';
    nextQuestion();
  }

  function subModeForIdx(idx){
    if(state.mode==='mixed') return idx%2===0 ? 'flash' : 'make10';
    return state.mode;
  }

  function nextQuestion(){
    if(advanceTimer){ clearTimeout(advanceTimer); advanceTimer=null; }
    if(state.idx>=state.total){ showResults(); return; }
    gameProg.innerHTML = az('第')+' '+(state.idx+1)+'/'+state.total+' '+az('題');
    var sub = subModeForIdx(state.idx);
    var diff = diffForLevel(currentLevel());
    if(sub==='flash') runFlashQuestion(diff);
    else runMake10Question(diff);
  }

  function comboHTML(){
    return state.streak>=2 ? ('🔥 '+az('連對')+' x'+state.streak) : '';
  }

  function startAnswerTimer(container, answerMs, onTimeout){
    var bar = container.querySelector('.qtimer .fill');
    var wrap = container.querySelector('.qtimer');
    var startTs = performance.now();
    bar.style.transition = 'none';
    bar.style.width = '100%';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        bar.style.transition = 'width '+answerMs+'ms linear';
        bar.style.width = '0%';
      });
    });
    var lowTimer = setTimeout(function(){ if(wrap) wrap.classList.add('low'); }, Math.round(answerMs*0.65));
    var timeout = setTimeout(function(){ onTimeout(); }, answerMs);
    return {
      startTs: startTs,
      clear: function(){ clearTimeout(timeout); clearTimeout(lowTimer); }
    };
  }

  function runFlashQuestion(diff){
    gameBody.innerHTML =
      '<div class="progressbar"><div class="fill" style="width:'+Math.round((state.idx/state.total)*100)+'%"></div></div>'
      + '<div class="combo-badge">'+comboHTML()+'</div>'
      + '<div class="flash-stage" id="flash-stage"><div class="flash-ready">👀 '+az('準備仔細看')+'...</div></div>';
    setTimeout(function(){
      var q = buildFlashQuestion(diff);
      var stage = document.getElementById('flash-stage');
      if(!stage) return;
      stage.innerHTML = q.useScatter ? renderScatter(q.n) : renderTenFrame(q.n);
      setTimeout(function(){
        if(!document.getElementById('flash-stage')) return;
        stage.innerHTML = '<div class="flash-hidden">❓</div>';
        showChoices(q, diff, az('剛剛一共有幾個？'));
      }, diff.flashMs);
    }, 500);
  }

  function runMake10Question(diff){
    var q = buildMake10Question();
    gameBody.innerHTML =
      '<div class="progressbar"><div class="fill" style="width:'+Math.round((state.idx/state.total)*100)+'%"></div></div>'
      + '<div class="combo-badge">'+comboHTML()+'</div>'
      + '<div class="flash-stage">'+renderTenFrame(q.n)+'<div style="font-size:15px;font-weight:700;">'+az('這是')+' '+q.n+'</div></div>';
    showChoices(q, diff, az('要湊成10，還缺幾個？'));
  }

  function showChoices(q, diff, promptText){
    var extra = document.createElement('div');
    extra.innerHTML =
      '<p class="q-text">'+promptText+'</p>'
      + '<div class="qtimer"><div class="fill"></div></div>'
      + '<div class="quiz-choices">'+q.choices.map(function(c,i){
          return '<button class="choice-btn" data-v="'+c+'">'+c+'</button>';
        }).join('')+'</div>'
      + '<div class="feedback"></div>'
      + '<div class="nextbar"></div>';
    gameBody.appendChild(extra);

    var answered = false;
    var btns = Array.prototype.slice.call(gameBody.querySelectorAll('.choice-btn'));
    var timer = startAnswerTimer(gameBody, diff.answerMs, function(){
      if(answered) return;
      answered = true;
      handleAnswer(null, q, diff, timer.startTs, btns);
    });
    btns.forEach(function(btn){
      btn.addEventListener('click', function(){
        if(answered) return;
        answered = true;
        timer.clear();
        handleAnswer(parseInt(btn.dataset.v,10), q, diff, timer.startTs, btns);
      });
    });
  }

  function handleAnswer(selected, q, diff, startTs, btns){
    var reactionMs = clamp(performance.now()-startTs, 0, diff.answerMs);
    var isCorrect = selected===q.correct;
    btns.forEach(function(b){
      b.disabled = true;
      var v = parseInt(b.dataset.v,10);
      if(v===q.correct) b.classList.add('correct');
      else if(v===selected) b.classList.add('wrong');
    });
    var pts = 0, bonusMsg = '';
    if(isCorrect){
      state.correct++;
      state.streak++;
      state.bestStreak = Math.max(state.bestStreak, state.streak);
      pts = 10;
      if(reactionMs <= diff.answerMs*0.4){ pts += 5; bonusMsg += ' ⚡'+az('快手加分'); }
      if(state.streak>=3 && state.streak%3===0){ pts += 5; bonusMsg += ' 🔥'+az('連對')+'x'+state.streak+az('加碼'); }
    } else {
      state.streak = 0;
    }
    state.xp += pts;
    state.reactions.push(reactionMs);
    state.idx++;

    var fb = gameBody.querySelector('.feedback');
    fb.className = 'feedback '+(isCorrect?'ok':'no');
    var secTxt = (reactionMs/1000).toFixed(1)+' '+az('秒');
    fb.innerHTML = (isCorrect ? ('✅ '+az('答對了！')) : (selected===null ? ('⏰ '+az('時間到')+'！') : ('❌ '+az('再想想'))) )
      + (isCorrect ? ('<span class="xp-pop">+'+pts+' XP'+bonusMsg+'</span>') : ('<span class="xp-pop">'+az('正確答案是')+' '+q.correct+'</span>'))
      + '<span class="react">'+az('反應時間')+'：'+secTxt+'</span>';

    var nextbar = gameBody.querySelector('.nextbar');
    var label = state.idx>=state.total ? (az('查看結果')+' →') : (az('下一題')+' →');
    nextbar.innerHTML = '<button class="btn primary" id="next-btn">'+label+'</button>';
    document.getElementById('next-btn').addEventListener('click', nextQuestion);
    advanceTimer = setTimeout(nextQuestion, 1500);
  }

  function showResults(){
    var xpBefore = getXp();
    var liBefore = levelInfo(xpBefore);
    var xpAfter = addXp(state.xp);
    var liAfter = levelInfo(xpAfter);
    var leveledUp = liAfter.level > liBefore.level;
    var avgReaction = state.reactions.length ? (state.reactions.reduce(function(a,b){return a+b;},0)/state.reactions.length) : 0;
    var pct = state.correct/state.total;
    var emoji = pct>=0.85 ? '🏆' : pct>=0.6 ? '🌟' : pct>=0.35 ? '💪' : '🙂';
    var msgs = ['多加油，你會越來越快！','已經有感覺了，繼續加油！','很不錯喔，反應越來越快了！','太厲害了，你是數感高手！'];
    var msgIdx = pct>=0.85?3:pct>=0.6?2:pct>=0.35?1:0;

    gameProg.textContent = '';
    gameBody.innerHTML =
      '<div class="results">'
      + '<div class="emoji-lg">'+emoji+'</div>'
      + '<div class="xp-gain">+'+state.xp+' XP</div>'
      + '<p>'+az(msgs[msgIdx])+'</p>'
      + '<div class="stat-row">'
      + '<div class="stat"><div class="v">'+state.correct+'/'+state.total+'</div><div class="l">'+az('答對題數')+'</div></div>'
      + '<div class="stat"><div class="v">'+(avgReaction/1000).toFixed(1)+' '+az('秒')+'</div><div class="l">'+az('平均反應')+'</div></div>'
      + '<div class="stat"><div class="v">'+state.bestStreak+'</div><div class="l">'+az('最高連對')+'</div></div>'
      + '</div>'
      + (leveledUp ? ('<div class="levelup">🎉 '+az('恭喜升級')+'！Lv.'+liAfter.level+' '+az(liAfter.title)+'</div>') : '')
      + '<div class="levelbar-wrap">'
      + '<div class="xp-row"><div class="xp-bar"><div class="fill" style="width:'+liAfter.pct+'%"></div></div>'
      + '<div class="xp-txt">'+(liAfter.next ? (liAfter.xp+' / '+liAfter.nextNeed+' XP') : az('已達最高等級'))+'</div></div>'
      + '</div>'
      + '<div class="btnrow">'
      + '<button class="btn primary" id="retry-btn">'+az('再玩一次')+'</button>'
      + '<button class="btn gold" id="results-lb-btn">🏆 '+az('排行榜')+'</button>'
      + '<button class="btn" id="home-btn">'+az('返回首頁')+'</button>'
      + '</div></div>';

    document.getElementById('retry-btn').addEventListener('click', function(){ startRound(state.mode); });
    document.getElementById('home-btn').addEventListener('click', closeGame);
    document.getElementById('results-lb-btn').addEventListener('click', openLeaderboard);

    submitNsRecord(state.mode, state.correct, state.total, state.xp, avgReaction, liAfter.level);
  }

  renderHub();
})();
</script>
